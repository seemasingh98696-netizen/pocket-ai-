name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Copy wllama WASM runtime locally
        run: |
          for t in single-thread multi-thread; do
            f=$(find node_modules/@wllama/wllama -path "*/$t/wllama.wasm" | head -1)
            mkdir -p public/wllama/$t
            if [ -n "$f" ]; then cp "$(dirname "$f")"/* public/wllama/$t/; else echo "WARNING: $t runtime not found"; fi
          done
          ls -R public/wllama
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: POCKET-AI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
